<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="50%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- British Flag Stylized Elements in Circle -->
  <g filter="url(#dropShadow)">
    <circle cx="256" cy="256" r="160" fill="#1e3a8a" />
    <!-- Diagonal cross (St Patrick & St Andrew) -->
    <path d="M142 142L370 370M370 142L142 370" stroke="#ffffff" stroke-width="36" />
    <path d="M142 142L370 370M370 142L142 370" stroke="#dc2626" stroke-width="18" />
    <!-- Straight cross (St George) -->
    <path d="M256 96v320M96 256h320" stroke="#ffffff" stroke-width="54" />
    <path d="M256 96v320M96 256h320" stroke="#dc2626" stroke-width="32" />
  </g>

  <!-- Modern Headphones Arc over the Circle -->
  <path d="M110 260c0-80 65-146 146-146s146 66 146 146" fill="none" stroke="#f8fafc" stroke-width="28" stroke-linecap="round" />
  
  <!-- Left & Right Ear Cushions -->
  <rect x="90" y="240" width="38" height="74" rx="19" fill="#f8fafc" />
  <rect x="384" y="240" width="38" height="74" rx="19" fill="#f8fafc" />

  <!-- Audio Wave Bars at the Bottom -->
  <g fill="#10b981">
    <rect x="210" y="430" width="12" height="32" rx="6" />
    <rect x="232" y="416" width="12" height="60" rx="6" />
    <rect x="254" y="404" width="12" height="84" rx="6" />
    <rect x="276" y="418" width="12" height="56" rx="6" />
    <rect x="298" y="432" width="12" height="28" rx="6" />
  </g>
</svg>

