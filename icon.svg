<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Sound Waves (Left & Right) -->
  <path d="M140 216c-18 24-18 56 0 80" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M100 186c-34 44-34 96 0 140" stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.4" />
  
  <path d="M372 216c18 24 18 56 0 80" stroke="#ffffff" stroke-width="20" stroke-linecap="round" fill="none" opacity="0.8" />
  <path d="M412 186c34 44 34 96 0 140" stroke="#ffffff" stroke-width="18" stroke-linecap="round" fill="none" opacity="0.4" />

  <!-- Center Microphone Body -->
  <g filter="url(#shadow)">
    <!-- Capsule -->
    <rect x="206" y="128" width="100" height="176" rx="50" fill="url(#micGrad)" />
    <!-- Stand Arc -->
    <path d="M168 250c0 58 39 104 88 104s88-46 88-104" stroke="#ffffff" stroke-width="24" stroke-linecap="round" fill="none" />
    <!-- Stand Base Pole -->
    <path d="M256 354v56" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
    <!-- Stand Base Horizontal -->
    <path d="M196 410h120" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
  </g>

  <!-- Sparkle / AI Star -->
  <path d="M360 110l12 28 28 12-28 12-12 28-12-28-28-12 28-12z" fill="#facc15" />
</svg>

